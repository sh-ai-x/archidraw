# archidraw -- Excalidraw-class whiteboard + MCP integration

## §1 Goal

Excalidraw JSON 스키마를 단일 진실 원천으로 하는 브라우저 화이트보드 GUI 와 MCP 서버를 구축하여, 한쪽의 element mutate 가 즉시 반대편에 1 초 이내 반영되는 상태 동기화를 end-to-end 로 입증한다.

## §2 Validate

- 4 independent sources (Excalidraw docs, MCP SDK repo, excalidraw-mcp community impl, HN practitioner survey)
- value_score = (50 * 20) / 12,500 = **4.0** (after cost lever to 12.5k)
- ambiguity_score = **5** (best-effort; accepted per cycle log)

## §3 Non-goals

1. 실시간 멀티유저 collaboration (Yjs 미도입 -- slot 만 확보)
2. 클라우드 계정 / 인증 / 결제 (self-hosted only)
3. 모바일 / 태블릿 네이티브 (desktop browser 만)
4. PNG/SVG 외 export (PDF/Mermaid/draw.io XML 추가 안 함)
5. Excalidraw library marketplace 연동 (내부 도구만)

## §4 Phase plan

7 steps with single owner per step (4* backend-architect, 1* frontend-developer, 1* general-purpose, 1* backend-architect for release).

| # | Step | Owner |
|---|---|---|
| 1 | schema | backend-architect |
| 2 | store | backend-architect |
| 3 | mcp | backend-architect |
| 4 | gui | frontend-developer |
| 5 | bridge | backend-architect |
| 6 | e2e | general-purpose |
| 7 | release | backend-architect |

## §5 AC (1 per step)

7 acceptance criteria each mapped 1:1 to `phases/archidraw-mvp/step<N>.md` AC. See PRD §5 for full table; build runner's verification exit code 0 is the only signal the plan cares about.

## §6 Hand-off

- Review artifact (this proposal): `docs/proposals/archidraw/archidraw-mvp.html`
- Next stage: `/dev-kit:build` (per-step worktree, body-less commits)
- Risks table in PRD §6 captures mitigation for each identified blocker.

